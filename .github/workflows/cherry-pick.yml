name: Auto Cherry Pick

on:
  workflow_dispatch:

jobs:
  cherry-pick:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout local repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch and Cherry-Pick (Auto-skip conflicts)
        run: |
          # 添加远程仓库
          git remote add spidey https://github.com/spidey-t/android_kernel_oneplus_sm8250.git || true
          git fetch spidey lineage-23.2

          # 按照时间从早到晚排序的 Commit 列表
          COMMITS="59580b2 39e586f 9095b3b 38d5045 648fade a2aaaee 55b6e67 bd1d761 ab6b2ec 0ab63d9"

          # 逐个尝试合入，冲突则自动跳过
          for c in $COMMITS; do
            echo "----------------------------------------"
            echo "正在尝试提取提交: $c"
            if ! git cherry-pick $c; then
              echo "警告: 提交 $c 产生冲突，自动跳过此提交！"
              git cherry-pick --abort
            else
              echo "成功: 提交 $c 已成功合入！"
            fi
          done

      - name: Push changes
        run: |
          git push origin HEAD
